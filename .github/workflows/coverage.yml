# Coverage floor calibrated against baseline observed on 2026-05-11:
#   llmsh-policy: 89% / llmsh-audit: 95% / llmsh-redact: 99%
# Floor = floor(min - 2) = floor(89 - 2) = 87.
# Ratchet up after each PR that improves coverage.

name: coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  llvm-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Generate summary
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info

      - name: Upload summary as PR comment artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt

      - name: Enforce minimum coverage on critical crates
        run: |
          for package in llmsh-policy llmsh-audit llmsh-redact; do
            echo "Checking coverage floor for ${package}"
            cargo llvm-cov --locked \
              --fail-under-lines 87 \
              --package "${package}"
          done
