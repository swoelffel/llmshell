[workspace]
resolver = "2"
members = [
    "crates/llmsh-llm",
    "crates/llmsh-llm-openai",
    "crates/llmsh-llm-ollama",
    "crates/llmsh-policy",
    "crates/llmsh-redact",
    "crates/llmsh-audit",
    "crates/llmsh-tools",
    "crates/llmsh-core",
    "crates/llmsh-cli",
]

[workspace.package]
version = "0.2.15-dev"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Safety-first agentic shell: natural-language tasks, typed tools, policy gates, tamper-evident audit logs."
repository = "https://github.com/swoelffel/llmshell"
homepage = "https://github.com/swoelffel/llmshell"
readme = "README.md"
keywords = ["agent", "shell", "llm", "terminal", "audit"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Stéphane Woelffel <swoelffel@castelis.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
nu-ansi-term = "0.50"
reedline = "0.36"
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
glob = "0.3"
directories = "5"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = { version = "0.32", default-features = false, features = ["disk", "system"] }
libc = "0.2"
