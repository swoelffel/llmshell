[package]
name = "llmsh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLMShell CLI entry point — `llmsh` binary."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[[bin]]
name = "llmsh"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
llmsh-audit = { path = "../llmsh-audit" }
llmsh-core = { path = "../llmsh-core" }
llmsh-llm = { path = "../llmsh-llm" }
llmsh-llm-openai = { path = "../llmsh-llm-openai" }
llmsh-llm-anthropic = { path = "../llmsh-llm-anthropic" }
llmsh-llm-ollama = { path = "../llmsh-llm-ollama" }
llmsh-llm-mistral = { path = "../llmsh-llm-mistral" }
llmsh-policy = { path = "../llmsh-policy" }
llmsh-tools = { path = "../llmsh-tools" }
reedline = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
